<svg viewBox="0 0 620 135" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg font-family="system-ui, -apple-system, sans-serif"">
  <!-- Background Card -->
  <rect x="2" y="2" width="616" height="131" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Left: Pay with -->
  <text x="22" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#0f766e">Pay with</text>
  <line x1="124" y1="18" x2="124" y2="117" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" />

  <!-- Middle: Payment Logos (Row 1) -->
  <!-- VISA -->
  <g transform="translate(136, 16)">
    <rect width="46" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="5" y="29" font-family="Impact, 'Arial Black', sans-serif" font-style="italic" font-weight="900" font-size="16" fill="#1a1f71">VISA</text>
    <path d="M 5 17 L 11 17 L 8 29 Z" fill="#faa61a" opacity="0.9" />
  </g>

  <!-- Mastercard -->
  <g transform="translate(187, 16)">
    <rect width="46" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="18" cy="23" r="11" fill="#eb001b" />
    <circle cx="28" cy="23" r="11" fill="#f79e1b" fill-opacity="0.88" />
  </g>

  <!-- AMEX -->
  <g transform="translate(238, 16)">
    <rect width="46" height="46" rx="6" fill="#006fcf" stroke="#0056a3" stroke-width="1" />
    <text x="6" y="27" font-family="sans-serif" font-weight="900" font-size="11" fill="#ffffff" letter-spacing="-0.5">AMERICAN</text>
    <text x="7" y="37" font-family="sans-serif" font-weight="900" font-size="10" fill="#ffffff" letter-spacing="-0.5">EXPRESS</text>
  </g>

  <!-- DBBL NEXUS -->
  <g transform="translate(289, 16)">
    <rect width="46" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <path d="M 12 14 C 24 14 34 20 34 32 C 24 32 14 26 14 14 Z" fill="#006a4e" />
    <path d="M 12 32 C 24 32 34 26 34 14 C 24 14 14 20 14 32 Z" fill="#e11d48" opacity="0.8" />
    <text x="8" y="42" font-family="sans-serif" font-weight="800" font-size="6" fill="#1e293b">DBBL NEXUS</text>
  </g>

  <!-- UnionPay -->
  <g transform="translate(340, 16)">
    <rect width="46" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="8" y="14" width="30" height="20" rx="3" fill="#e11d48" />
    <rect x="18" y="14" width="20" height="20" rx="3" fill="#006a4e" />
    <rect x="28" y="14" width="10" height="20" rx="3" fill="#0284c7" />
    <text x="10" y="27" font-family="sans-serif" font-weight="900" font-size="7" fill="#ffffff">UnionPay</text>
    <text x="12" y="38" font-family="sans-serif" font-weight="800" font-size="6" fill="#ffffff">银联</text>
  </g>

  <!-- Rocket -->
  <g transform="translate(391, 16)">
    <rect width="46" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <path d="M 28 12 L 36 20 L 26 28 L 20 22 Z" fill="#8c3494" />
    <text x="6" y="38" font-family="sans-serif" font-weight="900" font-size="9" fill="#8c3494">রকেট</text>
  </g>

  <!-- OK Wallet -->
  <g transform="translate(442, 16)">
    <rect width="46" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="23" cy="21" r="12" fill="#facc15" />
    <text x="16" y="25" font-family="sans-serif" font-weight="900" font-size="12" fill="#0f172a">OK</text>
    <text x="9" y="40" font-family="sans-serif" font-weight="800" font-size="7" fill="#0f172a">wallet</text>
  </g>

  <!-- Middle: Payment Logos (Row 2) -->
  <!-- bKash / Bird -->
  <g transform="translate(136, 72)">
    <rect width="46" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <path d="M 12 18 L 32 14 L 24 30 L 16 26 Z" fill="#e11d48" />
    <path d="M 24 30 L 34 26 L 30 36 Z" fill="#be123c" />
  </g>

  <!-- Tap -->
  <g transform="translate(187, 72)">
    <rect width="46" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="23" cy="23" r="13" fill="#e11d48" />
    <circle cx="23" cy="23" r="8" fill="#ffffff" />
    <circle cx="23" cy="23" r="4" fill="#16a34a" />
    <text x="14" y="42" font-family="sans-serif" font-weight="900" font-size="8" fill="#e11d48">tap</text>
  </g>

  <!-- Meghna Pay -->
  <g transform="translate(238, 72)">
    <rect width="46" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="6" y="24" font-family="sans-serif" font-weight="900" font-size="7" fill="#0284c7">meghna</text>
    <text x="12" y="36" font-family="sans-serif" font-weight="900" font-size="10" fill="#0284c7">pay</text>
  </g>

  <!-- Upay Flame -->
  <g transform="translate(289, 72)">
    <rect width="46" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <path d="M 23 12 C 30 12 34 20 30 30 C 26 36 18 36 15 28 C 12 20 18 12 23 12 Z" fill="#ea580c" />
    <path d="M 23 18 C 27 18 29 23 27 28 C 24 31 20 31 18 26 C 16 21 20 18 23 18 Z" fill="#facc15" />
  </g>

  <!-- M Cash -->
  <g transform="translate(340, 72)">
    <rect width="46" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="14" y="12" width="18" height="26" rx="3" fill="#15803d" />
    <rect x="17" y="15" width="12" height="14" fill="#ffffff" />
    <text x="8" y="44" font-family="sans-serif" font-weight="900" font-size="6" fill="#15803d">এম ক্যাশ</text>
  </g>

  <!-- Upay Smile -->
  <g transform="translate(391, 72)">
    <rect width="46" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="17" cy="18" r="4" fill="#facc15" />
    <circle cx="29" cy="18" r="4" fill="#7e22ce" />
    <path d="M 17 26 Q 23 34 29 26" fill="none" stroke="#7e22ce" stroke-width="3" stroke-linecap="round" />
    <text x="10" y="42" font-family="sans-serif" font-weight="900" font-size="8" fill="#7e22ce">উপায়</text>
  </g>

  <!-- CellFin -->
  <g transform="translate(442, 72)">
    <rect width="46" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="6" y="26" font-family="'Trebuchet MS', sans-serif" font-weight="900" font-size="10" fill="#dc2626">Cell</text>
    <text x="25" y="26" font-family="'Trebuchet MS', sans-serif" font-weight="900" font-size="10" fill="#16a34a">Fin</text>
    <text x="7" y="38" font-family="sans-serif" font-weight="600" font-size="5" fill="#64748b">Banking and beyond</text>
  </g>

  <!-- Right: Verified by EPS -->
  <line x1="500" y1="18" x2="500" y2="117" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" />
  <g transform="translate(512, 28)">
    <text x="0" y="16" font-family="sans-serif" font-weight="800" font-size="13" fill="#0f766e">Verified by</text>
    
    <!-- EPS Logo -->
    <g transform="translate(0, 24)">
      <!-- 3 lines -->
      <rect x="0" y="4" width="10" height="4" rx="1" fill="#006a4e" />
      <rect x="0" y="12" width="10" height="4" rx="1" fill="#006a4e" />
      <rect x="0" y="20" width="10" height="4" rx="1" fill="#e11d48" />

      <!-- Red EPS text -->
      <text x="14" y="25" font-family="Impact, 'Arial Black', sans-serif" font-style="italic" font-weight="900" font-size="30" fill="#e11d48">EPS</text>
    </g>

    <text x="0" y="68" font-family="sans-serif" font-weight="900" font-size="7.5" fill="#006a4e" letter-spacing="0.4">EASY PAYMENT SYSTEM</text>
  </g>
</svg>
